AWSTemplateFormatVersion: '2010-09-09'
Description: |
  PharmaCare production stack — one EC2 t4g.small (ARM64, Ubuntu 24.04) behind an
  Elastic IP in Mumbai, with two ECR repos for the api + web images, an SSM-managed
  IAM role for the instance, and a GitHub Actions OIDC role for hands-off deploys.
  Single stack, single region. No load balancer, no autoscaling.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for break-glass SSH access (SSM is the primary path)

  SshCidr:
    Type: String
    Description: CIDR allowed to SSH on port 22 — tighten to your /32 in production
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  GitHubRepo:
    Type: String
    Description: GitHub repo (owner/name) that the GHA deploy role trusts
    Default: abhishekSonawane97/pharmacare

  GitHubBranch:
    Type: String
    Description: Branch on which deploys are allowed (ref pinned in OIDC sub claim)
    Default: main

Mappings:
  # Latest Ubuntu 24.04 LTS ARM64 AMI is resolved at deploy time via the SSM parameter
  # in the Instance resource. Keeping this empty placeholder for future override needs.
  Empty: { Empty: { Empty: '' } }

Resources:

  # ─── Networking ────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Project, Value: pharmacare }
        - { Key: Name, Value: pharmacare-vpc }

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Project, Value: pharmacare }
        - { Key: Name, Value: pharmacare-public-subnet }

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Project, Value: pharmacare }]

  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Project, Value: pharmacare }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ─── Security ──────────────────────────────────────────────────────────
  InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: pharmacare instance — 80/443 public, 22 from SshCidr only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: "HTTP" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS (future)" }
        - { IpProtocol: tcp, FromPort: 22,  ToPort: 22,  CidrIp: !Ref SshCidr, Description: "SSH (break-glass)" }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0, Description: "All outbound" }
      Tags: [{ Key: Project, Value: pharmacare }]

  # ─── EC2 instance role (SSM + ECR pull + Parameter Store read) ─────────
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: ssm-parameter-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pharmacare/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm
      Tags: [{ Key: Project, Value: pharmacare }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ─── EC2 instance ──────────────────────────────────────────────────────
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.small
      # Resolves to the latest Ubuntu 24.04 LTS ARM64 EBS-gp3 AMI at deploy time.
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id}}'
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref InstanceSG]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euxo pipefail
          exec > >(tee -a /var/log/pharmacare-bootstrap.log) 2>&1
          echo "[bootstrap] start $(date -u +%FT%TZ)"

          # Timezone
          timedatectl set-timezone Asia/Kolkata

          # Base packages
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release unzip

          # Docker official repo (Compose v2 plugin only ships from here)
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
            gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu $(. /etc/os-release; echo $VERSION_CODENAME) stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io \
            docker-buildx-plugin docker-compose-plugin
          usermod -aG docker ubuntu
          systemctl enable --now docker

          # AWS CLI v2 (arm64)
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          rm -rf /tmp/aws /tmp/awscliv2.zip

          # SSM agent (preinstalled on Ubuntu 24.04 via snap)
          if ! systemctl is-active --quiet snap.amazon-ssm-agent.amazon-ssm-agent; then
            snap install amazon-ssm-agent --classic || true
          fi
          systemctl restart snap.amazon-ssm-agent.amazon-ssm-agent || true

          # App directory
          mkdir -p /opt/pharmacare
          chown ubuntu:ubuntu /opt/pharmacare

          echo "[bootstrap] done $(date -u +%FT%TZ)"
      Tags:
        - { Key: Project, Value: pharmacare }
        - { Key: Name, Value: pharmacare-prod }

  # ─── Elastic IP (attached) ─────────────────────────────────────────────
  EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Project, Value: pharmacare }]

  EIPAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt EIP.AllocationId
      InstanceId: !Ref Instance

  # ─── ECR repos ─────────────────────────────────────────────────────────
  EcrApi:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pharmacare-api
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep last 10 sha-tagged images",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["sha-"], "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags: [{ Key: Project, Value: pharmacare }]

  EcrWeb:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pharmacare-web
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep last 10 sha-tagged images",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["sha-"], "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags: [{ Key: Project, Value: pharmacare }]

  # ─── GitHub OIDC + deploy role ─────────────────────────────────────────
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS rotates GitHub's thumbprint internally; this seed value is sufficient.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  GhaDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pharmacare-gha-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource:
                  - !GetAtt EcrApi.Arn
                  - !GetAtt EcrWeb.Arn
        - PolicyName: ssm-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: pharmacare
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pharmacare/*
        - PolicyName: ec2-describe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
      Tags: [{ Key: Project, Value: pharmacare }]

Outputs:
  PublicIp:
    Description: Elastic IP — open this in a browser
    Value: !Ref EIP
    Export: { Name: !Sub '${AWS::StackName}-PublicIp' }

  InstanceId:
    Description: EC2 instance ID (for SSM targeting)
    Value: !Ref Instance
    Export: { Name: !Sub '${AWS::StackName}-InstanceId' }

  EcrApiUri:
    Description: ECR URI for the api image
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrApi}'
    Export: { Name: !Sub '${AWS::StackName}-EcrApiUri' }

  EcrWebUri:
    Description: ECR URI for the web image
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrWeb}'
    Export: { Name: !Sub '${AWS::StackName}-EcrWebUri' }

  GhaDeployRoleArn:
    Description: ARN to set as the GitHub Actions secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GhaDeployRole.Arn
    Export: { Name: !Sub '${AWS::StackName}-GhaDeployRoleArn' }

  SshCommand:
    Description: SSH break-glass command (SSM Session Manager is preferred)
    Value: !Sub 'ssh -i ~/.ssh/${KeyName}.pem ubuntu@${EIP}'

  SsmConnectCommand:
    Description: SSM Session Manager command (preferred over SSH)
    Value: !Sub 'aws ssm start-session --target ${Instance} --region ${AWS::Region}'
