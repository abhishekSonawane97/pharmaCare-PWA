worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # api caps json at 100kb; allow some headroom for future use
  client_max_body_size 2m;

  # Compression — meaningful gains on Next.js HTML + JSON API responses
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # Log forwarded IPs in case the box later sits behind Cloudflare
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  upstream web_upstream { server web:3000; keepalive 16; }
  upstream api_upstream { server api:4000; keepalive 16; }

  server {
    listen 80 default_server;
    server_name _;

    # /api/* → Express api container.
    # NOTE: trailing slash on both source + proxy_pass matters; this preserves
    # the /api prefix when forwarding (the Express app mounts routes at /api/*).
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Everything else → Next.js (web) container
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      # WebSocket upgrade (harmless if unused in prod, needed if you ever turn
      # on Next.js HMR or add server-sent events)
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
