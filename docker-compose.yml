# Production-shape compose file. Used as-is by Dokploy / Traefik.
#
# This file does NOT expose api or web on host ports — Traefik routes the
# public domain to the web container via the internal Docker network, and
# the api container is only reachable from web (via http://api:4000).
#
# For local dev, `docker-compose.override.yml` adds host port mappings so
# you can hit http://localhost:3000 and http://localhost:4000 directly.
# Compose v2 merges both files automatically when you run `docker compose up`.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-}
      TENANT_PHARMACARE_MONGO_URI: ${TENANT_PHARMACARE_MONGO_URI:-}
      TENANT_ADILPHARMACY_MONGO_URI: ${TENANT_ADILPHARMACY_MONGO_URI:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 365d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pharmacare.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TZ: Asia/Kolkata
    expose:
      - "4000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      API_PROXY_TARGET: http://api:4000
    expose:
      - "3000"
