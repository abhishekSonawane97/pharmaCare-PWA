# Render Blueprint — one-click deploy.
# After pushing to GitHub: Render dashboard → New → Blueprint → connect repo.
# Render will provision both services and wire them together automatically.

services:
  # ─── Express API (apps/api) ───────────────────────────────────────────
  - type: web
    name: pharmacare-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: singapore       # closest to Atlas Mumbai
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: TZ
        value: Asia/Kolkata
      - key: MONGO_URI
        sync: false                  # set manually in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true          # Render auto-generates a strong secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@pharmacare.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: pharmacare-web
          type: web
          property: host             # auto-resolves to https://pharmacare-web.onrender.com

  # ─── Next.js web (apps/web) ────────────────────────────────────────────
  - type: web
    name: pharmacare-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    region: singapore
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_TARGET
        fromService:
          name: pharmacare-api
          type: web
          property: host             # auto-resolves to https://pharmacare-api.onrender.com
